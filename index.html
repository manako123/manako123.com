<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>QR Verifizierung</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2c2f33;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #23272a;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 350px;
    }

    img {
      width: 180px;
      height: 180px;
      margin-bottom: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Verifizierung erforderlich</h2>
    <p>Scanne den QR-Code mit deinem Handy</p>

    <!-- QR Code -->
    <img src="qr code.png" alt="QR Code">

    <p class="note">Öffne discord auf deinem Handy und scanne den Code, um fortzufahren.</p>
  </div>
</body>
</html>
